<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061426"><meta name="description" content="DropBeat — موزیک‌پلیر قطره‌ای شفاف">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css"><title>DropBeat | موزیک‌پلیر قطره‌ای</title>
</head>
<body>
<main class="app">
  <header><div class="brand"><span class="brand-dot"></span><div><b>DropBeat</b><small>LIQUID MUSIC PLAYER</small></div></div><button id="pickTop" class="glass tiny" aria-label="انتخاب آهنگ">＋</button></header>
  <section class="hero">
    <div class="orbital o1"></div><div class="orbital o2"></div>
    <button id="drop" class="drop" aria-label="واکنش قطره">
      <span class="drop-glint"></span><span class="drop-core"><span class="play-symbol" id="playSymbol">▶</span></span>
      <span class="drop-ripple"></span>
    </button>
    <div class="hint">برای واکنش قطره لمسش کن</div>
  </section>
  <section class="track">
    <div class="track-meta"><div><div id="trackName" class="track-name">آهنگی انتخاب نشده</div><div id="trackArtist" class="track-artist">یک فایل موسیقی انتخاب کن</div></div><button id="pick" class="glass pick">انتخاب آهنگ</button></div>
    <input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="موقعیت آهنگ">
    <div class="times"><span id="current">۰:۰۰</span><span id="duration">۰:۰۰</span></div>
    <div class="controls"><button id="prev" class="control" aria-label="قبلی">|◀</button><button id="play" class="main-play" aria-label="پخش یا توقف">▶</button><button id="next" class="control" aria-label="بعدی">▶|</button></div>
    <div class="visualizer" id="visualizer" aria-label="نمایشگر صدا"></div>
  </section>
  <footer><span class="status-dot"></span><span id="status">آماده پخش</span><span class="foot-brand">GLASS • LIQUID • SOUND</span></footer>
  <input id="file" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" hidden>
  <audio id="audio" preload="metadata"></audio>
</main>
<script src="app.js"></script>
</body></html>
